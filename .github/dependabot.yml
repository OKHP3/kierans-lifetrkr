version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/Chicago
    # Stable version updates wait three days; security updates bypass this.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm-patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "06:30"
      timezone: America/Chicago
    open-pull-requests-limit: 10
