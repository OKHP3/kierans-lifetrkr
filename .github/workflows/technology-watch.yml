name: Technology watch

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technology-watch
  cancel-in-progress: false

jobs:
  inventory:
    name: Check official stable releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.x'
      - name: Generate complete release inventory
        run: npm run audit:technology
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Add report to run summary
        if: always()
        run: |
          if [ -f .cache/technology-audit/report.md ]; then
            cat .cache/technology-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save reports, including partial lookup failures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: technology-audit
          path: .cache/technology-audit/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  latest-lts:
    name: Test latest Node LTS candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # A canary build only. CI and Pages retain their reviewed Node selection.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:technology
      - run: npm run test:browser-harness
      - run: npm run check
      - run: npm run check:a11y
      - run: npm run test:sync
      - run: npm run test:service-worker
      - run: npm run build
      - run: npm run release:check
