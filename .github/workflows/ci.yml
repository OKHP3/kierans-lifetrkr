name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Use the public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Normalize Replit lockfile URLs
        shell: bash
        run: |
          test -f package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const internalPrefix = 'http://package-firewall.replit.local/npm/';
          const publicPrefix = 'https://registry.npmjs.org/';
          const lockfile = fs.readFileSync(path, 'utf8');
          const normalized = lockfile.replaceAll(internalPrefix, publicPrefix);
          fs.writeFileSync(path, normalized);
          console.log(normalized === lockfile
            ? 'Lockfile already uses portable package URLs.'
            : 'Replaced Replit-internal package URLs with the public npm registry.');
          NODE

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
