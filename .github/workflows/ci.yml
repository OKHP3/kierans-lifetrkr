name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, audit, type-check, build, and inspect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Use the public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Accessibility source check
        run: npm run check:a11y

      - name: Safe sync regression tests
        run: npm run test:sync

      - name: Build
        run: npm run build

      - name: Inspect build artifact
        run: node scripts/inspect-artifact.mjs
