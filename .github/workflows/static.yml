name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: 'npm'

      - name: Use the public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Normalize Replit lockfile URLs
        shell: bash
        run: |
          test -f package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const internalPrefix = 'http://package-firewall.replit.local/npm/';
          const publicPrefix = 'https://registry.npmjs.org/';
          const lockfile = fs.readFileSync(path, 'utf8');
          const normalized = lockfile.replaceAll(internalPrefix, publicPrefix);
          fs.writeFileSync(path, normalized);
          console.log(normalized === lockfile
            ? 'Lockfile already uses portable package URLs.'
            : 'Replaced Replit-internal package URLs with the public npm registry.');
          NODE

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
